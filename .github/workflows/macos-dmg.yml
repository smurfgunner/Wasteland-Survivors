name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Releases are serialized so two closely-spaced pushes cannot calculate the same next version.
concurrency:
  group: macos-release-main
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    # Version-sync PR merges must not start a second release.
    if: "${{ !contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore: sync project version to ') }}"
    runs-on: xcode-27
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Import signing certificate
        env:
          CODESIGNING_BASE64: ${{ secrets.codesigning }}
          CODESIGNING_PASSWORD: ${{ secrets.codesigning_password }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/codesigning.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$CODESIGNING_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "build-keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "build-keychain-password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CODESIGNING_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-keychain-password" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application identity was found in the codesigning secret."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Determine next release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "")] | sort_by(split(".") | map(tonumber)) | last // "1.0.0"')
          IFS='.' read -r MAJOR MINOR _ <<< "$LATEST_VERSION"
          RELEASE_VERSION="${MAJOR}.$((MINOR + 1)).0"

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Sync project marketing version
        run: |
          PROJECT_FILE="Wasteland Survivors.xcodeproj/project.pbxproj"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $RELEASE_VERSION;/g" "$PROJECT_FILE"

          if ! grep -q "MARKETING_VERSION = $RELEASE_VERSION;" "$PROJECT_FILE"; then
            echo "Failed to update MARKETING_VERSION in $PROJECT_FILE."
            exit 1
          fi

      - name: Archive macOS app
        run: |
          xcodebuild \
            -project "Wasteland Survivors.xcodeproj" \
            -scheme "Wasteland Survivors macOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Wasteland Survivors.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/Wasteland Survivors.xcarchive/Products/Applications/Wasteland Survivors.app"
          STAGING_PATH="$RUNNER_TEMP/dmg-staging"
          DMG_PATH="$RUNNER_TEMP/Wasteland-Survivors.dmg"

          mkdir -p "$STAGING_PATH"
          ditto "$APP_PATH" "$STAGING_PATH/Wasteland Survivors.app"
          ln -s /Applications "$STAGING_PATH/Applications"
          hdiutil create \
            -volname "Wasteland Survivors" \
            -srcfolder "$STAGING_PATH" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG when credentials are configured
        if: ${{ env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' && env.APPLE_API_PRIVATE_KEY_BASE64 != '' }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Publish DMG to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "$DMG_PATH#Wasteland-Survivors-$RELEASE_VERSION.dmg" \
            --target "$GITHUB_SHA" \
            --title "Wasteland Survivors $RELEASE_VERSION" \
            --generate-notes

      - name: Create project version sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Wasteland Survivors.xcodeproj/project.pbxproj"

          if git diff --cached --quiet; then
            echo "The project already uses MARKETING_VERSION $RELEASE_VERSION."
            exit 0
          fi

          BRANCH_NAME="sync-version-$RELEASE_VERSION-$GITHUB_RUN_ID"
          git switch -c "$BRANCH_NAME"
          git commit -m "chore: sync project version to $RELEASE_VERSION"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore: sync project version to $RELEASE_VERSION" \
            --body "Automated version sync for release v$RELEASE_VERSION." \
            --auto-merge \
            --merge-method squash
