name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CODESIGNING_BASE64: ${{ secrets.codesigning }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/codesigning.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$CODESIGNING_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "build-keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "build-keychain-password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "build-keychain-password" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application identity was found in the codesigning secret."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Archive macOS app
        run: |
          xcodebuild \
            -project "Wasteland Survivors.xcodeproj" \
            -scheme "Wasteland Survivors macOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Wasteland Survivors.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/Wasteland Survivors.xcarchive/Products/Applications/Wasteland Survivors.app"
          STAGING_PATH="$RUNNER_TEMP/dmg-staging"
          DMG_PATH="$RUNNER_TEMP/Wasteland-Survivors.dmg"

          mkdir -p "$STAGING_PATH"
          ditto "$APP_PATH" "$STAGING_PATH/Wasteland Survivors.app"
          ln -s /Applications "$STAGING_PATH/Applications"
          hdiutil create \
            -volname "Wasteland Survivors" \
            -srcfolder "$STAGING_PATH" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG when credentials are configured
        if: ${{ env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' && env.APPLE_API_PRIVATE_KEY_BASE64 != '' }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Wasteland-Survivors-macOS-${{ github.sha }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
