name: Create Release PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create develop to main PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Commit project version bump to develop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main develop --quiet

          LATEST_VERSION=$(gh release list --repo "$GH_REPO" --limit 100 --json tagName --jq '[.[].tagName | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "")] | sort_by(split(".") | map(tonumber)) | last // "1.0.0"')
          IFS='.' read -r MAJOR MINOR _ <<< "$LATEST_VERSION"
          RELEASE_VERSION="${MAJOR}.$((MINOR + 1)).0"

          git switch --force-create develop origin/develop
          PROJECT_FILE="Wasteland Survivors.xcodeproj/project.pbxproj"
          CURRENT_BUILD=$(awk -F' = ' '/CURRENT_PROJECT_VERSION = / { gsub(";", "", $2); print $2; exit }' "$PROJECT_FILE")
          NEXT_BUILD=$((CURRENT_BUILD + 1))

          sed -i -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $RELEASE_VERSION;/g" "$PROJECT_FILE"
          sed -i -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $NEXT_BUILD;/g" "$PROJECT_FILE"

          if git diff --quiet -- "$PROJECT_FILE"; then
            echo "The develop branch already uses the requested project version values."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$PROJECT_FILE"
            git commit -m "chore: bump project version to $RELEASE_VERSION"
            git push origin develop
          fi

      - name: Build changelog and create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main develop --quiet

          # Filter by reachability locally. A PR is already synced when its
          # merge commit is an ancestor of main.
          CHANGELOG=""
          while IFS=$'\t' read -r number title commit; do
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              CHANGELOG+="- #$number: $title"$'\n'
            fi
          done < <(gh pr list \
            --repo "$GH_REPO" \
            --base develop \
            --state merged \
            --limit 1000 \
            --json number,title,mergeCommit,mergedAt \
            --jq 'sort_by(.mergedAt) | .[] | select(.mergeCommit.oid != null) | [.number, .title, .mergeCommit.oid] | @tsv')

          if [ -z "$CHANGELOG" ]; then
            echo "No merged develop PRs are waiting to be synced into main."
            exit 0
          fi

          BODY=$(mktemp)
          {
            echo "## Changelog"
            echo
            printf '%s' "$CHANGELOG"
            echo
            echo "This PR was created automatically from \`develop\` into \`main\`."
            echo "Merge this PR with a merge commit (do not squash) to preserve branch history and enable selective rollbacks."
          } > "$BODY"

          EXISTING_PR=$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --repo "$GH_REPO" \
              --title "Sync develop into main" \
              --body-file "$BODY"
            echo "Updated PR #$EXISTING_PR."
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head develop \
              --title "Sync develop into main" \
              --body-file "$BODY"
          fi
